name: finance_app
description: Aplikasi pencatat keuangan pribadi.
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: '>=3.3.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
 
  device_info_plus: ^10.1.0

  # Database lokal
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
 
  # Code generation helper
  drift_dev: ^2.18.0         # hanya untuk codegen
 
  # UUID generator
  uuid: ^4.4.0
 
  # Backend
  supabase_flutter: ^2.5.3
 
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
 
  # Connectivity (offline detection)
  connectivity_plus: ^6.0.3
 
  # Serialisasi JSON (untuk SyncQueue payload)
  json_annotation: ^4.9.0
 
  # UI utilities
  intl: ^0.19.0               # format tanggal & mata uang
  fl_chart: ^0.68.0           # chart pengeluaran
  envied: ^1.3.4
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  envied_generator: ^1.1.1
 
flutter:
  uses-material-design: true